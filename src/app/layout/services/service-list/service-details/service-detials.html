<div class="service-card h-100 text-center p-4">
  <div class="service-icon-box mx-auto mb-3">
    <img
      [src]="imgBaseUrl + services_List.iconImg"
      [alt]="services_List.title"
      class="service-icon"
    />
  </div>
  <h4 class="service-title fw-bold mb-2">{{ services_List.title }}</h4>
  <p class="service-desc mb-0">{{ services_List.description }}</p>
</div>
