<hr class="frame-divider my-5" />

<!-- Sub-section Header -->
<div class="text-center mb-4">
  <div class="exp-icon-box mx-auto mb-3">
    <svg
      width="24"
      height="24"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
      <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
    </svg>
  </div>
  <h2 class="exp-heading fw-bold mb-0">
    Experience & <span class="title-accent">Training</span>
  </h2>
</div>

<!-- Timeline -->
@if (experienceList && experienceList.length > 0) {
  <div class="exp-timeline mx-auto" style="max-width: 1100px">
    @for (item of experienceList; track item._id || $index) {
      <div class="exp-card position-relative">
        <!-- النقطة على خط الـ Timeline -->
        <span class="timeline-dot"></span>

        <div class="d-flex flex-wrap justify-content-between align-items-center mb-2 gap-2">
          <div>
            <h5 class="exp-role fw-bold mb-1">{{ item.role }}</h5>
            <h6 class="exp-company fw-semibold mb-0">{{ item.company }}</h6>
          </div>
          <span class="period-badge">{{ item.period }}</span>
        </div>

        @if (item.description) {
          <p class="exp-desc mb-0 mt-3">{{ item.description }}</p>
        }
      </div>
    }
  </div>
}
