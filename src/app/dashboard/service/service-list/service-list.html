<div class="manage-card">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold mb-0">Services</h4>
    <button type="button" class="btn btn-purple" (click)="addClicked.emit()">
      + Add New Service
    </button>
  </div>

  <ng-content></ng-content>

  <!-- جدول الخدمات -->
  @if (services.length > 0) {
    <div class="table-responsive">
      <table class="table align-middle services-table">
        <thead>
          <tr>
            <th>Icon</th>
            <th>Title</th>
            <th>Description</th>
            <th class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody>
          @for (service of services; track service._id) {
            <tr>
              <td>
                @if (service.iconImg) {
                  <img [src]="imgBaseUrl + service.iconImg" [alt]="service.title" class="thumb" />
                }
              </td>
              <td class="fw-semibold">{{ service.title }}</td>
              <td class="desc-cell">{{ service.description | slice: 0 : 80 }}...</td>
              <td class="text-end">
                <button class="btn btn-sm btn-edit me-2" (click)="editClicked.emit(service)">
                  Edit
                </button>
                <app-service-delete
                  [id]="service._id"
                  (deleted)="deleted.emit()"
                  (failed)="failed.emit($event)"
                ></app-service-delete>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  } @else {
    <p class="text-muted text-center py-4 mb-0">No services yet — add your first one.</p>
  }
</div>
