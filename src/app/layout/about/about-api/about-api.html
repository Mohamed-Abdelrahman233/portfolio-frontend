@if (myProfile) {
  <!-- Header Section -->
  <div class="text-center mx-auto mb-5" style="max-width: 720px">
    <div class="hero-logo-box mx-auto mb-3">
      <svg
        width="40"
        height="40"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.4"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
      </svg>
    </div>

    <h1 class="fw-bold section-title mb-3">About <span class="title-accent">Me</span></h1>

    <p class="section-subtitle mb-0">
      Get to know me — who I am, what I do, and what drives my work.
    </p>
  </div>

  <!-- Profile Card -->
  <div class="row justify-content-center">
    <div class="col-lg-10" style="max-width: 1100px">
      <div class="about-card p-5">
        <span class="badge-subtitle mb-2 d-inline-block">Profile</span>
        <h1 class="about-name mb-2">{{ myProfile.name }}</h1>
        <h3 class="about-job mb-4">{{ myProfile.jobTitle }}</h3>

        <hr class="divider my-4" />

        <p class="about-text mb-4">{{ myProfile.aboutText }}</p>

        @if (myProfile.cvUrl) {
          <div class="about-actions mt-4">
            <a
              [href]="myProfile.cvUrl"
              target="_blank"
              rel="noopener noreferrer"
              class="btn-brand-primary px-4 py-2"
            >
              Download CV
            </a>
          </div>
        }
      </div>
    </div>
  </div>
}
